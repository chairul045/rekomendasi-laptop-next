<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="lapmatch-primary-grad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lapmatch-screen-grad" x1="30" y1="25" x2="90" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="lapmatch-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Laptop Screen Outer Outline -->
  <rect x="22" y="24" width="76" height="52" rx="6" fill="url(#lapmatch-screen-grad)" stroke="url(#lapmatch-primary-grad)" stroke-width="2.5" />

  <!-- Screen Content: Matching Check & Spark -->
  <path d="M42 50 L52 60 L78 34" stroke="url(#lapmatch-primary-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lapmatch-glow)" />

  <!-- Laptop Base -->
  <path d="M12 80 C12 77 15 76 18 76 L102 76 C105 76 108 77 108 80 L114 88 C115 90 113 92 110 92 L10 92 C7 92 5 90 6 88 Z" fill="url(#lapmatch-screen-grad)" stroke="url(#lapmatch-primary-grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Trackpad Notch -->
  <rect x="48" y="80" width="24" height="4" rx="2" fill="url(#lapmatch-primary-grad)" opacity="0.8" />

  <!-- Sparkle Accent Top Right -->
  <circle cx="94" cy="22" r="3" fill="#22d3ee" filter="url(#lapmatch-glow)" />
</svg>
